# Redis master — aceita leitura e escrita.
# bind 0.0.0.0: o container precisa responder na rede Docker, não só em localhost.
bind 0.0.0.0
port 6379
protected-mode no

# AOF: os dados sobrevivem a restart do container (enquanto o volume existir).
appendonly yes
appendfsync everysec

# Se este nó for rebaixado a réplica (depois de um failover), anuncia
# o nome DNS do Compose para o Sentinel e para as outras instâncias.
replica-announce-ip redis-master
replica-announce-port 6379
