# Redis réplica — começa como cópia do master (somente leitura).
bind 0.0.0.0
port 6379
protected-mode no

appendonly yes
appendfsync everysec

# replicaof pelo nome DNS do Compose (não depende do IP estático).
# O Sentinel pode promover esta instância a master se o original cair.
replicaof redis-master 6379
replica-announce-ip redis-replica
replica-announce-port 6379
