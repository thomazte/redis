# Configuração-base do Redis Sentinel.
# Cada container copia este arquivo para /tmp (gravável). O Sentinel
# reescreve o arquivo ao promover um novo master; por isso não usamos
# o original montado como único destino.

port 26379
bind 0.0.0.0
protected-mode no
dir /tmp

# Nomes Docker (redis-master, sentinel-1, ...) em vez de IP fixo.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitora o master chamado "mymaster".
# Quórum 2: pelo menos 2 dos 3 Sentinels precisam concordar que o master caiu.
sentinel monitor mymaster redis-master 6379 2

# Considera o master fora após 5s sem resposta (default é 30s; 5s acelera a demo).
sentinel down-after-milliseconds mymaster 5000

# Tempo máximo para concluir o failover.
sentinel failover-timeout mymaster 10000

# Quantas réplicas podem ressincronizar em paralelo após o failover.
sentinel parallel-syncs mymaster 1
